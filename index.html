<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--sidebar-bg:#c62828;--sidebar-hover:#b71c1c;--sidebar-active:#a31515;--primary:#d32f2f;--primary-hover:#c62828;--bg:#f0f2f5;--white:#fff;--text:#343a40;--text-secondary:#6c757d;--text-muted:#adb5bd;--border:#dee2e6;--border-light:#e9ecef;--danger:#dc3545;--danger-hover:#bb2d3b;--success:#198754;--warning:#fd7e14;--radius:6px;--font:'Open Sans',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:100%}body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;display:flex;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:var(--sidebar-bg);display:flex;flex-direction:column;height:100vh;box-shadow:2px 0 8px rgba(0,0,0,.1);z-index:10}

.sidebar-brand .brand-icon{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:1.2rem;cursor:pointer;overflow:hidden;padding:0}
.sidebar-brand .brand-text{color:#fff;font-weight:700;font-size:.95rem;line-height:1.2}
.sidebar-brand .brand-sub{color:rgba(255,255,255,.5);font-size:.7rem;font-weight:400}
.sidebar-nav{flex:1;padding:.75rem 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.25rem;color:rgba(255,255,255,.7);font-size:.82rem;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}

.nav-item .nav-icon{width:20px;height:20px;display:grid;place-items:center;font-size:1rem;opacity:.85}
.main-wrapper{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-header{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;min-height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative}
.header-logo-text{font-size:1.1rem;font-weight:700;color:var(--sidebar-bg);letter-spacing:-.02em}
#headerUserInfo{position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--text-secondary);font-weight:500}
.content{flex:1;overflow:hidden;padding:.5rem .75rem .5rem}
.page{display:none;height:100%;overflow-y:auto}.page.active{display:block}

table{table-layout:auto;width:100%}

.breadcrumb .current{color:var(--text-secondary);font-weight:600}
.card{background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border-light);font-size:1.05rem;font-weight:700;color:var(--text)}
.card-header-flex{display:flex;align-items:center;justify-content:space-between}
.card-body{padding:1.25rem;overflow-x:hidden}
.form-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}

.form-group.small{max-width:140px}.form-group.medium{max-width:250px}.form-group.large{max-width:350px}.form-group.xl{max-width:450px}

.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}

.table-toolbar .search-box .s-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem;pointer-events:none}

.cell-actions{display:flex;gap:.35rem;white-space:nowrap}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text-muted)}.empty-state .empty-icon{font-size:2rem;margin-bottom:.5rem;opacity:.4}

.toast{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem 1.1rem;font-size:.85rem;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.12);animation:toastIn .25s ease;display:flex;align-items:center;gap:.5rem;min-width:250px}
.toast.success{border-left:4px solid var(--success)}.toast.error{border-left:4px solid var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:999}.modal-overlay.active{display:grid}
