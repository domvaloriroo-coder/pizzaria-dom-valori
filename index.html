<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Dom Valori Rondonópolis - Sistema de Gestão</title>
<script src="https://jsdelivr.net"></script>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *, ::after, ::before {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body, html {
    height: 100%;
    width: 100%;
    background-color: #f3f4f6; /* Fundo cinza claro padrão */
    color: #1f2937; /* Texto escuro */
    font-family: 'Open Sans', sans-serif;
  }
  body {
    font-size: 14px;
    display: flex;
    flex-direction: column;
    overflow: auto;
  }
  .login-container {
    max-width: 400px;
    margin: 80px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    text-align: center;
  }
  .login-container h1 {
    margin-bottom: 20px;
    color: #b91c1c; /* Vermelho Pizzaria */
    font-size: 24px;
  }
  .form-group {
    margin-bottom: 15px;
    text-align: left;
  }
  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
  }
  .form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    font-size: 14px;
  }
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: #b91c1c;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-submit:hover {
    background: #991b1b;
  }
  .error-message {
    color: #dc2626;
    margin-top: 10px;
    font-weight: 500;
    display: none;
  }
</style>
</head>
<body>

<div class="login-container">
  <h1>🍕 Dom Valori Rondonópolis</h1>
  <p style="color: #6b7280; margin-bottom: 20px;">Sistema de Gestão da Pizzaria</p>
  
  <div class="form-group">
    <label>Usuário</label>
    <input type="text" id="userInput" placeholder="Digite seu usuário">
  </div>
  
  <div class="form-group">
    <label>Senha</label>
    <input type="password" id="passInput" placeholder="Digite sua senha">
  </div>
  
  <button class="btn-submit" onclick="tentarLogar()">Entrar</button>
  <div id="errorBox" class="error-message">Usuário ou senha incorretos</div>
</div>

<script>
// --- SUPABASE CONFIG ---
const SUPABASE_URL = 'https://supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4ZGdmc295em5la25xYmd3dW1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNTUzNzIsImV4cCI6MjEwNDczMTM3Mn0.wY_dkgDR2pU6ENbCf2LfMM8cpvIZ9mrAMO1shc2e3B8';
const STORE_ID = '00000000-0000-0000-0000-000000000001';

let supabaseClient = null;

try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  console.log('Supabase conectado com sucesso na Vercel!');
} catch (e) {
  console.error('Erro de conexão com o banco:', e);
}

async function tentarLogar() {
  const userVal = document.getElementById('userInput').value;
  const passVal = document.getElementById('passInput').value;
  const errorBox = document.getElementById('errorBox');
  
  errorBox.style.display = 'none';

  if (!supabaseClient) {
    alert('Erro: Conexão com o banco de dados não inicializada.');
    return;
  }

  // Busca o usuário direto na tabela 'users' criada no novo banco
  const { data, error } = await supabaseClient
    .from('users')
    .select('*')
    .eq('login', userVal)
    .eq('password', passVal)
    .single();

  if (error || !data) {
    errorBox.style.display = 'block';
  } else {
    alert('Login efetuado com sucesso! Redirecionando para o PDV...');
    // Aqui o sistema prossegue para carregar as 117 pizzas
    window.location.reload(); 
  }
}
</script>
</body>
</html>
