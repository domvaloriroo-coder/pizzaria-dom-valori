<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Dom Valori Rondonópolis — Sistema de Gestão</title>
<script src="https://unpkg.com"></script>
<link href="https://googleapis.com" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--sidebar-bg:#c62828;--sidebar-hover:#b71c1c;--sidebar-active:#a31515;--primary:#d32f2f;--primary-hover:#c62828;--bg:#f0f2f5;--white:#fff;--text:#343a40;--text-secondary:#6c757d;--text-muted:#adb5bd;--border:#dee2e6;--border-light:#e9ecef;--danger:#dc3545;--danger-hover:#bb2d3b;--success:#198754;--warning:#fd7e14;--radius:6px;--font:'Open Sans',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:100%}body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;display:flex;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:var(--sidebar-bg);display:flex;flex-direction:column;height:100vh;box-shadow:2px 0 8px rgba(0,0,0,.1);z-index:10}
.sidebar-brand{padding:1.25rem 1rem;display:flex;align-items:center;gap:.65rem;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-brand .brand-icon{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:1.2rem;cursor:pointer;overflow:hidden;padding:0}
.sidebar-brand .brand-text{color:#fff;font-weight:700;font-size:.95rem;line-height:1.2}
.sidebar-brand .brand-sub{color:rgba(255,255,255,.5);font-size:.7rem;font-weight:400}
.sidebar-nav{flex:1;padding:.75rem 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.25rem;color:rgba(255,255,255,.7);font-size:.82rem;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:#fff;border-left-color:rgba(255,255,255,.5)}
.nav-item .nav-icon{width:20px;height:20px;display:grid;place-items:center;font-size:1rem;opacity:.85}
.main-wrapper{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-header{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;min-height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative}
.header-logo-text{font-size:1.1rem;font-weight:700;color:var(--sidebar-bg);letter-spacing:-.02em}
#headerUserInfo{position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);font-size:.9rem;color:var(--text-secondary);font-weight:500}
.content{flex:1;overflow:hidden;padding:.5rem .75rem .5rem}
.page{display:none;height:100%;overflow-y:auto}.page.active{display:block}
#page-pdv.active{overflow:hidden}
table{table-layout:auto;width:100%}
th,td{white-space:normal;padding:0.4rem 0.3rem;font-size:0.8rem;word-wrap:break-word}
th{white-space:nowrap}
.breadcrumb{display:flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--text-muted);margin-bottom:.5rem}
.breadcrumb .current{color:var(--text-secondary);font-weight:600}
.card{background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border-light);font-size:1.05rem;font-weight:700;color:var(--text)}
.card-header-flex{display:flex;align-items:center;justify-content:space-between}
.card-body{padding:1.25rem;overflow-x:hidden}
.form-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.form-group{display:flex;flex-direction:column;gap:.3rem;flex:1;min-width:150px}
.form-group.small{max-width:140px}.form-group.medium{max-width:250px}.form-group.large{max-width:350px}.form-group.xl{max-width:450px}
label{font-size:.78rem;font-weight:600;color:var(--text-secondary)}
input,select,textarea{font-family:var(--font);font-size:.88rem;border:1px solid var(--border);border-radius:var(--radius);padding:.5rem .75rem;color:var(--text);background:var(--white);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(211,47,47,.12)}
.form-actions{display:flex;justify-content:flex-end;gap:.75rem;padding-top:1.25rem;border-top:1px solid var(--border-light);margin-top:1.25rem}
.btn{font-family:var(--font);font-size:.85rem;font-weight:600;border:none;border-radius:var(--radius);padding:.55rem 1.5rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.35rem}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--bg);color:var(--text-secondary);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border-light);color:var(--text)}
.btn-sm{padding:.35rem .75rem;font-size:.78rem}
.btn-outline-primary{background:transparent;color:var(--primary);border:1px solid var(--primary)}.btn-outline-primary:hover{background:var(--primary);color:#fff}
.btn-outline-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}.btn-outline-danger:hover{background:var(--danger);color:#fff}
.table-toolbar{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.table-toolbar .search-box{position:relative;min-width:260px}
.table-toolbar .search-box input{padding-left:2.2rem}
.table-toolbar .search-box .s-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem;pointer-events:none}
thead th{font-size:.75rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:.7rem 1rem;border-bottom:2px solid var(--border);background:var(--bg);white-space:nowrap}
tbody td{padding:.65rem 1rem;border-bottom:1px solid var(--border-light);font-size:.85rem;vertical-align:middle}
tbody tr:hover{background:#f8f9ff}
.cell-code{font-weight:600;color:var(--text)}.cell-name{font-weight:500}.cell-muted{color:var(--text-secondary)}.cell-price{font-weight:600;color:var(--success)}.cell-stock-low{color:var(--danger);font-weight:600}
.cell-actions{display:flex;gap:.35rem;white-space:nowrap}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text-muted)}.empty-state .empty-icon{font-size:2rem;margin-bottom:.5rem;opacity:.4}
.toast-container{position:fixed;top:1rem;right:1rem;z-index:1000;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem 1.1rem;font-size:.85rem;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.12);animation:toastIn .25s ease;display:flex;align-items:center;gap:.5rem;min-width:250px}
.toast.success{border-left:4px solid var(--success)}.toast.error{border-left:4px solid var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:999}.modal-overlay.active{display:grid}
.modal{background:var(--white);border-radius:var(--radius);padding:1.5rem;max-width:400px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.15);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end}
.pdv-container{display:flex;gap:.75rem;height:calc(100vh - 100px);min-height:350px}
.pdv-left{flex:1;display:flex;flex-direction:column;gap:.4rem;min-width:280px}
.pdv-right{flex:1.2;display:flex;flex-direction:column;background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden}
.pdv-type-selector{display:flex;gap:.3rem;margin-bottom:.3rem}
.pdv-type-btn{flex:1;padding:.4rem;border:2px solid var(--border);border-radius:var(--radius);background:var(--white);cursor:pointer;transition:all .15s;text-align:center;font-weight:600;font-size:.75rem;color:var(--text-secondary)}
.pdv-type-btn:hover{border-color:var(--primary)}.pdv-type-btn.active{border-color:var(--primary);background:#ffeaea;color:var(--primary)}
.pdv-type-btn .type-icon{font-size:1rem;display:block;margin-bottom:.1rem}
.pdv-search-box{position:relative}.pdv-search-box input{padding-left:2rem;font-size:.85rem}.pdv-search-box .search-icon{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem}
.pdv-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem}
.pdv-input-group{display:flex;flex-direction:column;gap:.15rem}
.pdv-input-group label{font-size:.65rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase}
.pdv-input-group input{font-size:.8rem;padding:.35rem .5rem}
.pdv-input-group input[readonly]{background:var(--bg)}
.pdv-include-btn{width:100%;padding:.5rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s;text-transform:uppercase}
.pdv-include-btn:hover{background:var(--primary-hover)}
.pdv-half-btn{width:100%;padding:.4rem;background:var(--white);border:2px solid var(--warning);color:var(--warning);border-radius:var(--radius);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s;text-transform:uppercase;margin-top:.3rem}
.pdv-half-btn:hover{background:#000;color:#fff;border-color:#000}
.pdv-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.pdv-action-btn{padding:.45rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.7rem;font-weight:600;color:var(--text-secondary)}
.pdv-action-btn:hover{background:var(--bg)}.pdv-action-btn.cancel{color:var(--danger)}.pdv-action-btn.cancel:hover{background:#fff5f5}
